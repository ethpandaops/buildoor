participants:
  - el_type: nethermind
    el_image: ethpandaops/nethermind:glamsterdam-devnet-8
    cl_type: lodestar
    cl_image: ethpandaops/lodestar:glamsterdam-devnet-8
    vc_image: ethpandaops/lodestar:glamsterdam-devnet-8
    validator_count: 32
    supernode: true
    # From Gloas the external builder is configured on the VALIDATOR client and
    # the beacon node requests bids from it on the validator's behalf, so the
    # CL-side --builder.urls the package wires up only covers the pre-Gloas
    # flow. The URL must match buildoor's --builder-api-url byte for byte: the
    # VC signs its UTF-8 bytes as the bid request auth data, which buildoor
    # verifies against its own configured builder URL. The VC flag needs
    # lodestar >= v1.47.0-rc.0, hence the devnet-8 images.
    vc_extra_params:
      - --builder.urls=http://buildoor:8080

network_params:
  preset: minimal
  genesis_delay: 20
  gloas_fork_epoch: 1

mev_type: buildoor
buildoor_params:
  image: buildoor:e2e
  builder_api: true
  epbs_builder: true
  lifecycle: true
  extra_args:
    - --deposit-max-fee=0
    - --builder-api-subsidy=100000000
    - --epbs-bid-min=1000000
    - --epbs-bid-subsidy=100000000
    - --log-level=debug

ethereum_genesis_generator_params:
  image: ethpandaops/ethereum-genesis-generator@sha256:399cfc4582d21c51d89f8cad1bfcfe59d88d95c47b9f78706d7c265bb1e348a1
