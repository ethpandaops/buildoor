name: Reusable check workflow
on:
  workflow_call:

permissions:
  contents: read

# shared check jobs (code checks only — the Kurtosis E2E lives in
# _shared-e2e.yaml and runs on PRs only, not on branch builds)
jobs:
  check_source:
    name: Run code checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # setup global dependencies
    - name: Set up go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.x
    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20.x
    - name: Cache node-modules for UI package
      id: cache-npm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./pkg/webui/node_modules
        key: webui-npm-${{ runner.os }}-${{ hashFiles('./pkg/webui/package-lock.json') }}
        restore-keys: |
          webui-npm-${{ runner.os }}-
          webui-npm-

    # build UI package (the bundle is gitignored and go:embed needs it)
    - name: Build UI package
      run: |
        make build-ui

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Check go fmt
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    - name: Run staticcheck
      run: staticcheck ./...

    #- name: Install golint
    #  run: go install golang.org/x/lint/golint@latest
    #- name: Run golint
    #  run: golint ./...

    - name: Run tests
      run: go test -race -vet=off ./...
