definitions:
  action_plan.BidPlan:
    properties:
      bid_candidate:
        description: |-
          BidCandidate overrides which built candidate payload this slot's p2p
          bids commit to: auto, all, or a specific candidate key.
        type: string
      bid_end_time:
        type: integer
      bid_increase:
        description: gwei
        type: integer
      bid_interval:
        description: ms, >= 0, 0 = single bid
        type: integer
      bid_keys_per_slot:
        description: |-
          BidKeysPerSlot overrides how many distinct builder keys may bid this
          slot (0 = no cap beyond the fleet).
        type: integer
      bid_keys_per_step:
        description: |-
          BidKeysPerStep overrides how many keys bid a payload per interval step
          (0 = every remaining key at once).
        type: integer
      bid_min_amount:
        description: gwei
        type: integer
      bid_start_time:
        type: integer
      bid_subsidy:
        description: gwei, negative = margin
        type: integer
      bid_value_gwei:
        description: |-
          BidValueGwei is an absolute bid base value replacing
          max(blockValue, min) + subsidy; BidIncrease still applies per re-bid.
          Allows underbidding the block value for testing.
        type: integer
      ignore_missing_prefs:
        description: |-
          IgnoreMissingPrefs bids with the payload's fee recipient when no gossip
          proposer preferences arrived for the slot, bypassing the skip gate.
        type: boolean
      key_strategy:
        description: |-
          KeyStrategy overrides which managed builder key signs this slot's bids:
          round_robin, single, random or least_used.
        type: string
      mode:
        $ref: '#/definitions/action_plan.Mode'
    type: object
  action_plan.BuildPlan:
    properties:
      candidates:
        additionalProperties:
          type: string
        description: |-
          Candidates overrides the global build-candidate policy for this slot:
          candidate key (parent_full, parent_empty, grandparent_full,
          grandparent_empty) -> mode (auto, always, never). Absent keys inherit
          the global policy.
        type: object
      inclusion_list:
        allOf:
        - $ref: '#/definitions/action_plan.InclusionListPlan'
        description: |-
          InclusionList overrides the inclusion list (FOCIL, Heze) handling for
          this slot; absent = inherit build.inclusion_list_mode/_bits.
      local:
        allOf:
        - $ref: '#/definitions/action_plan.LocalBuildPlan'
        description: |-
          Local overrides the local build extension (testing_buildBlockV1) for
          this slot; absent = inherit the global local_build settings. The EL's
          availability of the testing namespace still wins at build time.
      reorg_parent_payload:
        description: |-
          ReorgParentPayload builds on the grandparent (n-2) execution payload
          instead of the immediate parent: the FCU head block hash and the payload
          attributes' withdrawals are taken from the PARENT slot's payload
          attributes (whose parent is n-2), while every other property comes from
          the current slot. This is a deliberate parent-payload reorg attempt —
          rejected by mainnet forkchoice, but useful for exercising the reveal /
          inclusion path against a withheld parent.
        type: boolean
    type: object
  action_plan.BuilderAPIPlan:
    properties:
      execution_payment_gwei:
        description: |-
          ExecutionPaymentGwei replaces the global execution-payment portion for
          this slot: the absolute part of the served total value claimed as
          execution_payment (unbacked; capped by the proposer's advertised
          max_execution_payment unless ignore_preference_limit; wins over the
          percent).
        type: integer
      execution_payment_percent:
        description: |-
          ExecutionPaymentPercent replaces the global percentage (0-100) of the
          served total value claimed as execution_payment.
        type: integer
      ignore_preference_limit:
        description: |-
          IgnorePreferenceLimit serves this slot's execution-payment portion even
          beyond the proposer's advertised max_execution_payment (deliberately
          spec-violating).
        type: boolean
      key_strategy:
        description: |-
          KeyStrategy overrides which managed builder key signs this slot's served
          bids: round_robin, single, random or least_used.
        type: string
      mode:
        $ref: '#/definitions/action_plan.Mode'
      respond_at_ms:
        description: |-
          RespondAtMs overrides the global response gate (ms after the slot
          start; 0 = respond immediately), see config.BuilderAPIConfig.
        type: integer
      response_delay_ms:
        description: |-
          ResponseDelayMs delays the bid response by this many milliseconds
          (context-cancellable, capped at one slot).
        type: integer
      serve_candidates:
        description: |-
          ServeCandidates overrides which built candidate payloads bid requests
          for this slot may be answered from: all, canonical_only, or a
          comma-separated candidate key list.
        type: string
      total_value_override_gwei:
        description: |-
          TotalValueOverrideGwei is the absolute total proposer-visible bid value
          (before the Gloas execution-payment split), replacing block value +
          subsidy. May exceed the block value to test payment edge cases.
        type: integer
      value_subsidy_gwei:
        description: |-
          ValueSubsidyGwei replaces the global BlockValueSubsidyGwei for this slot
          (negative = margin, see config.BuilderAPIConfig.BlockValueSubsidyGwei).
        type: integer
    type: object
  action_plan.FrozenPlan:
    properties:
      bid:
        allOf:
        - $ref: '#/definitions/action_plan.ResolvedBidSettings'
        description: |-
          Resolved effective settings; a nil category = suppressed for this slot
          (by plan or by the global enable flags / protocol applicability).
      build:
        allOf:
        - $ref: '#/definitions/action_plan.ResolvedBuildSettings'
        description: |-
          Build is the complete resolved build decision for the slot (schedule +
          plan force/suppress). Always non-nil.
      builder_api:
        $ref: '#/definitions/action_plan.ResolvedBuilderAPISettings'
      fork:
        description: fork name at the target slot
        type: string
      frozen_at:
        type: string
      plan:
        allOf:
        - $ref: '#/definitions/action_plan.SlotPlan'
        description: raw sparse plan; nil = none existed
      reveal:
        $ref: '#/definitions/action_plan.ResolvedRevealSettings'
      slot:
        type: integer
      transforms:
        allOf:
        - $ref: '#/definitions/action_plan.ResolvedTransforms'
        description: |-
          Transforms carries the effective jq transform expressions (empty when no
          transform plan applies). Nil only when no plan expression is set.
    type: object
  action_plan.InclusionListPlan:
    properties:
      bits:
        description: 'Bits: view, all or none (see config.InclusionListBitsView).'
        type: string
      mode:
        description: 'Mode: include or omit (see config.InclusionListInclude).'
        type: string
      omit_txs:
        description: |-
          OmitTxs leaves these transactions (0x hashes) out of the slot's
          builds even in include mode: a payload censoring exactly them.
        items:
          type: string
        type: array
    type: object
  action_plan.LocalBuildPlan:
    properties:
      build_el_payload:
        description: |-
          BuildELPayload runs (or skips) the engine-API build for the slot,
          overriding build.engine_enabled.
        type: boolean
      enabled:
        description: Enabled forces the local build on or off for the slot.
        type: boolean
      gas_fill_pct:
        type: integer
      max_txs:
        description: Pool selection tweaks (tx source txpool).
        type: integer
      ordering:
        type: string
      payload_source:
        description: 'PayloadSource: el | local | local_or_el | higher_value.'
        type: string
      queued:
        description: |-
          Queued is the exact ordered list of transaction hashes (0x-hex) the
          slot's local payload is built from; every hash must be queued in the
          pool at build time and the order must respect each sender's nonces.
          Implies tx_source queued. Any deviation fails the build, never trims.
        items:
          type: string
        type: array
      transactions:
        description: |-
          Transactions is the exact raw transaction list (0x-hex, network
          encoding) the slot's local payload is built from.
        items:
          type: string
        type: array
      transactions_redacted:
        description: |-
          TransactionsRedacted is the length of Transactions when the list was
          hidden from a reader without a login (output only).
        type: integer
      tx_source:
        description: |-
          TxSource: txpool | empty | el_mempool | explicit (explicit requires
          Transactions; a non-empty Transactions list implies explicit).
        type: string
    type: object
  action_plan.Mode:
    enum:
    - disabled
    - custom
    type: string
    x-enum-varnames:
    - ModeDisabled
    - ModeCustom
  action_plan.PlanUpdate:
    properties:
      bid:
        items:
          type: integer
        type: array
      build:
        items:
          type: integer
        type: array
      builder_api:
        items:
          type: integer
        type: array
      delete:
        type: boolean
      from_slot:
        type: integer
      ignore_rules:
        description: |-
          IgnoreRules is two-state on purpose: absent = unchanged, true/false =
          set the slot's recurring-rule opt-out.
        type: boolean
      reveal:
        items:
          type: integer
        type: array
      set:
        additionalProperties:
          items:
            type: integer
          type: array
        type: object
      slots:
        items:
          type: integer
        type: array
      to_slot:
        type: integer
      transforms:
        items:
          type: integer
        type: array
    type: object
  action_plan.ResolvedBidSettings:
    properties:
      bid_candidate:
        description: |-
          BidCandidate is the effective bid candidate selection for the slot:
          auto, all, or a specific candidate key.
        type: string
      bid_keys_per_slot:
        description: |-
          BidKeysPerSlot caps how many distinct builder keys bid the slot
          (0 = no cap beyond the fleet).
        type: integer
      bid_keys_per_step:
        description: |-
          BidKeysPerStep is how many keys bid a payload per interval step
          (0 = every remaining key at once).
        type: integer
      end_ms:
        type: integer
      forced:
        description: |-
          Forced marks that the plan activated bidding although the module is
          globally disabled.
        type: boolean
      ignore_missing_prefs:
        description: IgnoreMissingPrefs bids without gossip proposer preferences.
        type: boolean
      increase_gwei:
        type: integer
      interval_ms:
        type: integer
      key_strategy:
        description: |-
          KeyStrategy is the effective builder key selection strategy for the
          slot's bids.
        type: string
      min_gwei:
        type: integer
      start_ms:
        type: integer
      subsidy_gwei:
        description: negative = margin
        type: integer
      value_gwei:
        description: |-
          ValueGwei, when set, is the absolute bid base value replacing the
          max(blockValue, min) + subsidy formula (IncreaseGwei still applies).
        type: integer
    type: object
  action_plan.ResolvedBuildSettings:
    properties:
      build:
        description: 'Build is the final decision: build a payload for this slot or
          not.'
        type: boolean
      build_start_time_ms:
        description: |-
          BuildStartTimeMs is the effective build start time, milliseconds
          relative to slot start (signed).
        type: integer
      candidate_modes:
        additionalProperties:
          type: string
        description: |-
          CandidateModes is the effective build-candidate policy for the slot:
          candidate key -> auto/always/never, merged from the global config and
          the plan's build.candidates overrides.
        type: object
      engine_enabled:
        description: |-
          EngineEnabled runs the engine-API build for the slot: the global
          build.engine_enabled, overridden by the plan's build.local
          build_el_payload.
        type: boolean
      forced:
        description: |-
          Forced marks builds the plan pushed past the schedule (they never
          consume the next_n budget).
        type: boolean
      inclusion_list:
        allOf:
        - $ref: '#/definitions/action_plan.ResolvedInclusionList'
        description: |-
          InclusionList is the effective inclusion list (FOCIL, Heze) handling:
          the global build.inclusion_list_mode/_bits, overridden by the plan's
          build.inclusion_list. Always non-nil.
      local:
        allOf:
        - $ref: '#/definitions/action_plan.ResolvedLocalBuildSettings'
        description: |-
          Local is the effective local build (testing_buildBlockV1) instruction,
          merged from the global local_build/txpool settings and the plan's
          build.local overrides. Always non-nil; Enabled=false when the extension
          is off for the slot. The EL's runtime availability of the testing
          namespace is checked by the builder, not here.
      plan_involved:
        description: |-
          PlanInvolved marks decisions where a per-slot plan existed or any
          consumer was effectively active — i.e. skips worth surfacing.
        type: boolean
      reorg_parent_payload:
        description: |-
          ReorgParentPayload builds the slot's payload on the grandparent (n-2)
          execution payload instead of the immediate parent — a deliberate
          parent-payload reorg attempt (see BuildPlan.ReorgParentPayload).
        type: boolean
      skip_reason:
        description: |-
          SkipReason is one of the BuildSkipReason* constants when Build is
          false, empty otherwise.
        type: string
    type: object
  action_plan.ResolvedBuilderAPISettings:
    properties:
      delay_ms:
        type: integer
      execution_payment_gwei:
        description: |-
          ExecutionPaymentGwei / ExecutionPaymentPercent claim part of the served
          total value as execution_payment (the trusted EL payment) instead of the
          trustless on-chain value — an unbacked claim (testing knob). The absolute
          amount wins over the percent; both 0 = the whole total goes via value.
          The portion is capped by the proposer's advertised max_execution_payment
          unless IgnorePreferenceLimit deliberately serves beyond it.
        type: integer
      execution_payment_percent:
        type: integer
      forced:
        description: |-
          Forced marks that the plan activated serving although the module is
          globally disabled.
        type: boolean
      ignore_preference_limit:
        type: boolean
      key_strategy:
        description: |-
          KeyStrategy is the effective builder key selection strategy for the
          slot's served bids.
        type: string
      respond_at_ms:
        description: |-
          RespondAtMs is the slot's response gate in ms after the slot start (0
          = respond immediately): bid responses wait for it and then serve the
          best payload built by then.
        type: integer
      serve_candidates:
        description: |-
          ServeCandidates is the effective serve-candidates policy for the slot
          (all, canonical_only, or a comma-separated candidate key list).
        type: string
      subsidy_gwei:
        description: negative = margin (Gloas only)
        type: integer
      total_value_gwei:
        description: |-
          TotalValueGwei, when set, is the absolute total proposer-visible bid
          value (before the Gloas execution-payment split).
        type: integer
    type: object
  action_plan.ResolvedInclusionList:
    properties:
      bits:
        description: 'Bits: view, all or none.'
        type: string
      mode:
        description: 'Mode: include or omit.'
        type: string
      omit_txs:
        description: OmitTxs are left out of the builds (0x hashes).
        items:
          type: string
        type: array
    type: object
  action_plan.ResolvedLocalBuildSettings:
    properties:
      allow_blobs_without_bundle:
        description: |-
          AllowBlobsWithoutBundle includes blob transactions on ELs whose testing
          path returns no blobs bundle.
        type: boolean
      base_fee_ceiling_gwei:
        description: |-
          BaseFeeCeilingGwei halves the fill above this next base fee (global-only,
          0 = off; exact lists are never reduced).
        type: integer
      enabled:
        type: boolean
      end_time_ms:
        type: integer
      forced:
        description: |-
          Forced marks that the plan enabled the local build although it is
          globally disabled.
        type: boolean
      gas_fill_pct:
        type: integer
      max_attempts:
        description: |-
          MaxAttempts / MaxStrikes are the retry policy of the txpool source
          (global-only).
        type: integer
      max_strikes:
        type: integer
      max_txs:
        description: Pool selection parameters (tx source txpool).
        type: integer
      ordering:
        type: string
      payload_source:
        description: 'PayloadSource: el | local | local_or_el | higher_value.'
        type: string
      queued:
        description: Queued is the exact ordered hash list for the queued source.
        items:
          type: string
        type: array
      rebuild_interval_ms:
        type: integer
      start_time_ms:
        description: |-
          StartTimeMs / EndTimeMs / RebuildIntervalMs time the testing builds
          (global-only; see config.LocalBuildConfig).
        type: integer
      transactions:
        description: Transactions is the explicit list (0x-hex) for the explicit source.
        items:
          type: string
        type: array
      transactions_redacted:
        description: |-
          TransactionsRedacted is the length of Transactions when the list was
          hidden from a reader without a login (output only).
        type: integer
      tx_source:
        description: 'TxSource: txpool | empty | el_mempool | explicit.'
        type: string
    type: object
  action_plan.ResolvedRevealSettings:
    properties:
      broadcast_validation:
        description: |-
          BroadcastValidation is the envelope submission's broadcast_validation
          level: gossip | consensus | consensus_and_equivocation.
        type: string
      bypass_deadline:
        description: |-
          BypassDeadline disables the "past the in-slot deadline → skip" check so
          deliberately late reveals are attempted.
        type: boolean
      gate_mode:
        description: |-
          GateMode decides the reveal moment: time | vote | vote_or_time |
          vote_and_time.
        type: string
      max_attempts:
        description: |-
          MaxAttempts / RetryIntervalMs are the publish retry policy
          (global-only, no per-slot override).
        type: integer
      retry_interval_ms:
        type: integer
      reveal_time_ms:
        type: integer
      suppressed:
        type: boolean
      vote_threshold_pct:
        description: |-
          VoteThresholdPct is the participation threshold (percent) opening the
          vote gate.
        type: integer
    type: object
  action_plan.ResolvedTransforms:
    properties:
      bid:
        type: string
      envelope:
        type: string
      payload:
        type: string
    type: object
  action_plan.RevealPlan:
    properties:
      broadcast_validation:
        description: |-
          BroadcastValidation overrides the envelope submission's broadcast
          validation level: gossip | consensus | consensus_and_equivocation.
        type: string
      gate_mode:
        description: |-
          GateMode overrides the reveal gate: time | vote | vote_or_time |
          vote_and_time.
        type: string
      mode:
        $ref: '#/definitions/action_plan.Mode'
      reveal_time_ms:
        description: RevealTimeMs is signed milliseconds relative to slot start (time
          gate).
        type: integer
      vote_threshold_pct:
        description: VoteThresholdPct overrides the vote gate's participation threshold.
        type: integer
    type: object
  action_plan.SlotPlan:
    properties:
      bid:
        $ref: '#/definitions/action_plan.BidPlan'
      build:
        $ref: '#/definitions/action_plan.BuildPlan'
      builder_api:
        $ref: '#/definitions/action_plan.BuilderAPIPlan'
      ignore_rules:
        description: |-
          IgnoreRules opts the slot out of every recurring rule, so it runs on the
          plain global baseline. Without it an empty plan is dropped, which would
          hand the slot straight back to the matching rule.
        type: boolean
      reveal:
        $ref: '#/definitions/action_plan.RevealPlan'
      rule_id:
        description: |-
          RuleID marks a plan synthesized from a recurring rule. Synthesized plans
          are never stored — the field is empty on every persisted plan.
        type: string
      slot:
        type: integer
      transforms:
        $ref: '#/definitions/action_plan.TransformPlan'
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  action_plan.SlotRule:
    properties:
      bid:
        $ref: '#/definitions/action_plan.BidPlan'
      build:
        $ref: '#/definitions/action_plan.BuildPlan'
      builder_api:
        $ref: '#/definitions/action_plan.BuilderAPIPlan'
      description:
        type: string
      enabled:
        type: boolean
      from_epoch:
        description: |-
          FromEpoch / ToEpoch bound the rule to an inclusive epoch window; nil is
          unbounded on that side.
        type: integer
      id:
        type: string
      reveal:
        $ref: '#/definitions/action_plan.RevealPlan'
      slots_in_epoch:
        description: |-
          SlotsInEpoch are the matched slot indices within an epoch (0-based, so
          31 is the last slot of a 32-slot epoch).
        items:
          type: integer
        type: array
      to_epoch:
        type: integer
      transforms:
        $ref: '#/definitions/action_plan.TransformPlan'
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  action_plan.TransformPlan:
    properties:
      bid:
        type: string
      envelope:
        type: string
      payload:
        type: string
    type: object
  api.ActionPlanResponse:
    properties:
      max_slot:
        type: integer
      min_slot:
        type: integer
      plans:
        items:
          $ref: '#/definitions/action_plan.SlotPlan'
        type: array
    type: object
  api.ActionPlanRulesRequest:
    properties:
      rules:
        items:
          $ref: '#/definitions/action_plan.SlotRule'
        type: array
    type: object
  api.ActionPlanRulesResponse:
    properties:
      rules:
        items:
          $ref: '#/definitions/action_plan.SlotRule'
        type: array
    type: object
  api.AuditLogResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/db.AuditLog'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.BidArtifactMetaEntry:
    properties:
      at:
        description: unix milliseconds
        type: integer
      execution_payment_gwei:
        type: integer
      fork:
        type: string
      index:
        type: integer
      total_value_gwei:
        type: integer
      transport:
        type: string
    type: object
  api.BidsWonResponse:
    properties:
      bids_won:
        items:
          $ref: '#/definitions/payload_bidder.WonBlock'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.BuilderAPIStatusResponse:
    properties:
      block_value_subsidy_gwei:
        type: integer
      enabled:
        type: boolean
      validator_count:
        type: integer
    type: object
  api.BuilderKeyExitRequest:
    properties:
      lower_target:
        type: boolean
    type: object
  api.BuilderKeysResponse:
    properties:
      aggregate:
        $ref: '#/definitions/builder_keys.Aggregate'
      keys:
        items:
          $ref: '#/definitions/builder_keys.State'
        type: array
      settings:
        $ref: '#/definitions/api.BuilderKeysSettings'
    type: object
  api.BuilderKeysSettings:
    properties:
      auto_deposit:
        type: boolean
      auto_exit:
        type: boolean
      max_index:
        type: integer
      target_count:
        type: integer
    type: object
  api.BuilderPreferencesEntry:
    properties:
      max_execution_payment:
        type: integer
      validator_pubkey:
        type: string
    type: object
  api.BuilderPreferencesResponse:
    properties:
      preferences:
        items:
          $ref: '#/definitions/api.BuilderPreferencesEntry'
        type: array
    type: object
  api.CreateRPCKeyRequest:
    properties:
      label:
        type: string
      rate_limit:
        description: calls per second, 0 = unlimited; absent = default
        type: integer
    type: object
  api.CreateRPCKeyResponse:
    properties:
      key:
        $ref: '#/definitions/api.RPCKeyView'
      secret:
        type: string
    type: object
  api.ELMempoolResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      stats:
        $ref: '#/definitions/txpool.MirrorStats'
      total:
        type: integer
      txs:
        items:
          $ref: '#/definitions/txpool.TxSummary'
        type: array
    type: object
  api.GetValidatorsResponse:
    properties:
      validators:
        items:
          $ref: '#/definitions/api.ValidatorRegistrationResponse'
        type: array
    type: object
  api.HeadVoteDetailResponse:
    properties:
      bucket_count:
        type: integer
      bucket_ms:
        type: integer
      root:
        type: string
      rows:
        items:
          $ref: '#/definitions/api.HeadVoteDetailRow'
        type: array
      slot:
        type: integer
      slot_start_ms:
        type: integer
      total_members:
        type: integer
    type: object
  api.HeadVoteDetailRow:
    properties:
      counts:
        items:
          type: integer
        type: array
      in_block_unseen:
        type: integer
      members:
        type: integer
      name:
        type: string
      seen:
        type: integer
    type: object
  api.LifecycleStatusResponse:
    properties:
      balance_gwei:
        type: integer
      builder_index:
        type: integer
      deposit_epoch:
        type: integer
      effective_balance_gwei:
        type: integer
      is_registered:
        type: boolean
      pending_payments_gwei:
        type: integer
      withdrawable_epoch:
        type: integer
    type: object
  api.LocalBuildStatusResponse:
    properties:
      availability:
        $ref: '#/definitions/payload_builder.LocalBuildAvailability'
      enabled:
        type: boolean
      engine_enabled:
        type: boolean
