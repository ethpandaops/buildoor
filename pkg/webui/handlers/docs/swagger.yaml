          canonical immediately (the payload is embedded in the block).
      source:
        description: '"epbs" | "builder_api"'
        type: string
      timestamp:
        type: string
      value_eth:
        type: string
      value_wei:
        type: string
    type: object
  slot_results.PayloadRecord:
    properties:
      base_fee_per_gas:
        description: wei
        type: string
      blob_gas_used:
        type: integer
      block_hash:
        type: string
      block_number:
        type: integer
      block_value_wei:
        type: string
      build:
        $ref: '#/definitions/payload_builder.BuildRef'
      built_at:
        type: string
      candidate:
        type: string
      captured:
        description: |-
          Captured marks that the payload is stored as an artifact (the engine
          payload and every selected one).
        type: boolean
      excess_blob_gas:
        type: integer
      extra_data:
        description: 0x-hex
        type: string
      fee_recipient:
        type: string
      gas_limit:
        type: integer
      gas_used:
        type: integer
      inclusion_list:
        allOf:
        - $ref: '#/definitions/payload_builder.InclusionListBuild'
        description: |-
          InclusionList is the inclusion list view (FOCIL, Heze) the payload
          was built against.
      num_blobs:
        type: integer
      num_execution_requests:
        type: integer
      num_transactions:
        type: integer
      num_withdrawals:
        type: integer
      parent_hash:
        type: string
      prev_randao:
        type: string
      receipts_root:
        type: string
      state_root:
        type: string
      timestamp:
        type: integer
    type: object
  slot_results.PayloadStatus:
    enum:
    - pending
    - canonical
    - missed
    - orphaned
    type: string
    x-enum-varnames:
    - PayloadStatusPending
    - PayloadStatusCanonical
    - PayloadStatusMissed
    - PayloadStatusOrphaned
  slot_results.RevealAttempt:
    properties:
      at:
        type: string
      attempt:
        type: integer
      error:
        type: string
      skip_reason:
        description: plan_disabled | disabled | late | vote_gate_timeout
        type: string
      started_at:
        description: |-
          StartedAt is when the attempt began (envelope construction + submit
          call); nil on skips where nothing was attempted.
        type: string
      status:
        $ref: '#/definitions/slot_results.RevealStatus'
      transport:
        type: string
    type: object
  slot_results.RevealStatus:
    enum:
    - suppressed
    - published
    - failed
    - skipped
    type: string
    x-enum-varnames:
    - RevealStatusSuppressed
    - RevealStatusPublished
    - RevealStatusFailed
    - RevealStatusSkipped
  slot_results.Selection:
    properties:
      at:
        type: string
      build:
        $ref: '#/definitions/payload_builder.BuildRef'
      fallback:
        description: |-
          Fallback marks an engine payload picked because no testing payload the
          payload source asked for existed (yet).
        type: boolean
      payload_hash:
        type: string
      reason:
        description: first | better
        type: string
    type: object
  slot_results.SlotBuild:
    properties:
      at:
        type: string
      error:
        description: Error is the primary target's error when the slot failed.
        type: string
      skip_reason:
        description: action_plan.BuildSkipReason* when skipped
        type: string
      status:
        $ref: '#/definitions/slot_results.BuildStatus'
      targets:
        items:
          $ref: '#/definitions/slot_results.BuildTarget'
        type: array
    type: object
  slot_results.SlotResult:
    properties:
      applied_plan:
        allOf:
        - $ref: '#/definitions/action_plan.FrozenPlan'
        description: AppliedPlan is the frozen plan snapshot the slot executed under.
      bids:
        items:
          $ref: '#/definitions/slot_results.BidAttempt'
        type: array
      block_submissions:
        items:
          $ref: '#/definitions/slot_results.BlockSubmission'
        type: array
      build:
        allOf:
        - $ref: '#/definitions/slot_results.SlotBuild'
        description: Build is the slot's build lifecycle with every target it ran.
      dropped_attempts:
        additionalProperties:
          type: integer
        description: |-
          DroppedAttempts counts attempts beyond the per-kind retention cap,
          keyed by kind ("bids", "block_submissions", "reveal_attempts").
        type: object
      epoch:
        type: integer
      fork:
        type: string
      inclusion:
        $ref: '#/definitions/slot_results.InclusionResult'
      payloads:
        additionalProperties:
          $ref: '#/definitions/slot_results.PayloadRecord'
        description: Payloads holds every payload built for the slot, by block hash.
        type: object
      reveal_attempts:
        items:
          $ref: '#/definitions/slot_results.RevealAttempt'
        type: array
      slot:
        type: integer
      tx_plan:
        allOf:
        - $ref: '#/definitions/slot_results.TxPlanResult'
        description: |-
          TxPlan is the post-inclusion verdict of a locally built payload: whether
          the canonical block holds exactly the transactions buildoor submitted,
          in order. Only set for included slots whose payload came from an
          explicit list (local build with a txpool/explicit/queued source).
      updated_at:
        type: string
    type: object
  slot_results.SubmissionStatus:
    enum:
    - received
    - accepted
    - failed
    type: string
    x-enum-varnames:
    - SubmissionStatusReceived
    - SubmissionStatusAccepted
    - SubmissionStatusFailed
  slot_results.TargetStatus:
    enum:
    - building
    - selected
    - no_payload
    - superseded
    type: string
    x-enum-varnames:
    - TargetBuilding
    - TargetSelected
    - TargetNoPayload
    - TargetSuperseded
  slot_results.TxPlanResult:
    properties:
      detail:
        type: string
      expected_count:
        type: integer
      expected_hashes:
        items:
          type: string
        type: array
      first_mismatch:
        type: integer
      included_count:
        type: integer
      status:
        $ref: '#/definitions/slot_results.TxPlanStatus'
      truncated:
        type: boolean
      tx_source:
        type: string
      verified_at:
        type: string
    type: object
  slot_results.TxPlanStatus:
    enum:
    - pending
    - match
    - mismatch
    - block_not_found
    - not_included
    - missed
    - orphaned
    type: string
    x-enum-varnames:
    - TxPlanPending
    - TxPlanMatch
    - TxPlanMismatch
    - TxPlanBlockNotFound
    - TxPlanNotIncluded
    - TxPlanMissed
    - TxPlanOrphaned
  tx_plan_verifier.Counters:
    properties:
      block_not_found:
        type: integer
      checked:
        type: integer
      match:
        type: integer
      mismatch:
        type: integer
      missed:
        type: integer
      orphaned:
        type: integer
    type: object
  txpool.FeeBucket:
    properties:
      el_gas:
        type: integer
      el_txs:
        type: integer
      max_fee:
        type: string
      min_fee:
        type: string
      private_gas:
        type: integer
      private_txs:
        type: integer
    type: object
  txpool.FeeDistribution:
    properties:
      buckets:
        items:
          $ref: '#/definitions/txpool.FeeBucket'
        type: array
      gas_limit:
        type: integer
      mirror_active:
        description: |-
          MirrorActive: the EL mempool part is current (the mirror runs only
          while builds use it).
        type: boolean
      next_base_fee:
        type: string
      private:
        description: 'Private: the pool''s transactions are included (logged-in readers).'
        type: boolean
    type: object
  txpool.MirrorStats:
    properties:
      active:
        description: 'Active: the mirror runs (a build used it within the idle timeout).'
        type: boolean
      arrivals:
        description: arrivals clearing the latest base fee
        type: integer
      blob_txs:
        type: integer
      cold_txs:
        description: |-
          ColdTxs are far below the base fee: only their facts are kept, the
          body is refetched from the EL once the base fee comes close.
        type: integer
      gas_sum:
        type: integer
      mode:
        description: |-
          Mode is how arrivals come in: websocket (live), filter (polled) or
          resync (full reads only, the EL has no filters).
        type: string
      senders:
        type: integer
      started:
        type: string
      synced_at:
        type: string
      txs:
        type: integer
    type: object
  txpool.Stats:
    properties:
      admitted:
        type: integer
      blob_txs:
        type: integer
      blobs:
        type: integer
      bytes:
        type: integer
      cleared:
        type: integer
      cold:
        description: |-
          Cold counts the transactions far below the base fee whose bodies wait
          in the store instead of memory.
        type: integer
      enabled:
        type: boolean
      evicted_included_by_other:
        type: integer
      evicted_included_by_us:
        type: integer
      evicted_nonce_too_low:
        type: integer
      evicted_strikes:
        type: integer
      evicted_ttl:
        type: integer
      gas_sum:
        type: integer
      last_admitted_at:
        type: string
      pending:
        type: integer
      rejected:
        additionalProperties:
          type: integer
        type: object
      removed:
        type: integer
      replaced:
        type: integer
      senders:
        type: integer
      value_wei:
        type: string
      version:
        type: integer
    type: object
  txpool.Summary:
    properties:
      base_fee:
        type: string
      blob_base_fee:
        type: string
      blobs:
        type: integer
      bytes:
        type: integer
      ceiling_applied:
        type: boolean
      fill_blobs:
        type: integer
      fill_candidates:
        description: EL mempool fill (tx source txpool_el_fill).
        type: integer
      fill_gas_sum:
        type: integer
      fill_selected:
        type: integer
      fill_skipped:
        additionalProperties:
          type: integer
        type: object
      gas_budget:
        type: integer
      gas_sum:
        type: integer
      hashes:
        items:
          type: string
        type: array
      inclusion_list_skipped:
        additionalProperties:
          type: integer
        description: |-
          InclusionListSkipped counts the list's transactions that could not
          execute, by reason.
        type: object
      inclusion_list_txs:
        type: integer
      pool_size:
        type: integer
      selected:
        type: integer
      skipped:
        additionalProperties:
          type: integer
        type: object
    type: object
  txpool.TxSummary:
    properties:
      arrived:
        type: string
      arrived_slot:
        type: integer
      blobs:
        type: integer
      cold:
        type: boolean
      gas:
        type: integer
      hash:
        type: string
      max_fee_per_blob_gas:
        type: string
      max_fee_per_gas:
        type: string
      max_priority_fee_per_gas:
        type: string
      nonce:
        type: integer
      sender:
        type: string
      seq:
        type: integer
      size:
        type: integer
      strikes:
        type: integer
      to:
        type: string
      type:
        type: integer
      value_wei:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/buildoor/action-plan:
    get:
      description: Returns all per-slot action plans within the inclusive slot range.
      operationId: getActionPlan
      parameters:
      - description: Range start slot (inclusive)
        in: query
        name: min_slot
        required: true
        type: integer
      - description: Range end slot (inclusive)
        in: query
        name: max_slot
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ActionPlanResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Plan service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get per-slot action plans
      tags:
      - ActionPlan
    post:
      consumes:
      - application/json
      description: |-
        Applies a bulk per-slot action plan mutation atomically (all
        targeted slots update or none). Category members are
        three-state (absent = unchanged, null = clear, object =
        replace); the "set" member supports fine-grained path updates
        like {"bid.bid_min_amount": 5000} for partial edits. Updates
        targeting past or already-frozen slots fail with 409.
        Requires authentication.
      operationId: updateActionPlan
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Plan updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateActionPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authoritative normalized result
          schema:
            $ref: '#/definitions/api.UpdateActionPlanResponse'
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Slot in the past or frozen
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Plan service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update per-slot action plans
      tags:
      - ActionPlan
  /api/buildoor/action-plan/rules:
    get:
      description: |-
        Returns the recurring slot rules, id-ascending (which is also
        their match order). A rule applies its categories to every slot
        whose index within the epoch matches, unless the slot carries
        an explicit plan.
      operationId: getActionPlanRules
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ActionPlanRulesResponse'
        "503":
          description: Plan service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get recurring action plan rules
      tags:
      - ActionPlan
    post:
      consumes:
      - application/json
      description: |-
        Atomically replaces the whole recurring rule set (every rule
        validates or nothing changes). Each rule matches slot indices
        within an epoch, optionally bounded to an epoch window, and
        carries the same categories as a slot plan — e.g. win slot 31
        of every epoch and withhold its payload. Already frozen slots
        keep the plan they froze with. Requires authentication.
      operationId: updateActionPlanRules
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Full rule set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ActionPlanRulesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authoritative rule set
          schema:
            $ref: '#/definitions/api.ActionPlanRulesResponse'
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Plan service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace the recurring action plan rules
      tags:
      - ActionPlan
  /api/buildoor/action-plan/test-transform:
    post:
      consumes:
      - application/json
      description: |-
        Runs an operator jq expression against a sample payload / bid /
        envelope (a captured artifact when sample_slot is given and
        available, otherwise a zero-value template of the object) and
        returns the transformed JSON, so expressions can be built and
        tested live before being saved to a slot plan. Bid and envelope
        transforms operate on the MESSAGE, matching production.
      operationId: testActionPlanTransform
      parameters:
      - description: Target, expression and optional sample slot
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.TestTransformRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TestTransformResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Evaluate a jq transform against a sample builder object
      tags:
      - ActionPlan
  /api/buildoor/audit-log:
    get:
      description: Returns a paginated list of authenticated mutating actions. Empty
        when no state-db is configured.
      operationId: getAuditLog
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - default: 20
        description: Limit for pagination (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.AuditLogResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the audit log
      tags:
      - Buildoor
  /api/buildoor/bids-won:
    get:
      description: Returns a paginated list of won blocks (Builder API and p2p ePBS)
        with transaction counts, blob counts, and values, read from the shared inclusion
        tracker.
      operationId: getBidsWon
      parameters:
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - default: 20
        description: Limit for pagination (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.BidsWonResponse'
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get bids won (blocks of ours included on chain)
      tags:
      - Buildoor
  /api/buildoor/builder-api-status:
    get:
      description: Returns the current status of the Builder API including configuration
        and validator count.
      operationId: getBuilderAPIStatus
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.BuilderAPIStatusResponse'
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Builder API status
      tags:
      - Buildoor
  /api/buildoor/builder-keys:
    get:
      description: |-
        Returns every managed builder key with its lifecycle status,
        on-chain builder index, balances and usage history, plus fleet
        aggregates and the mutable key-set settings.
      operationId: getBuilderKeys
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuilderKeysResponse'
        "404":
          description: Lifecycle management not enabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the managed builder key set
      tags:
      - Builder Keys
  /api/buildoor/builder-keys/{index}/deposit:
    post:
      description: |-
        Submits a builder deposit for the given key and waits for it to
        register on the beacon chain.
      operationId: depositBuilderKey
      parameters:
      - description: Internal builder key index
        in: path
        name: index
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid key index or deposit failed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deposit for a builder key
      tags:
      - Builder Keys
  /api/buildoor/builder-keys/{index}/exit:
    post:
      consumes:
      - application/json
      description: |-
        Submits a builder exit request for the given key. Irreversible:
        an exited key cannot be reactivated until its registry entry is
        reused by another builder's deposit. With lower_target the
        target key count is decremented in the same write, so the
        reconciler does not deposit a replacement.
      operationId: exitBuilderKey
      parameters:
      - description: Internal builder key index
        in: path
        name: index
        required: true
        type: integer
      - description: Exit options
        in: body
        name: request
        schema:
          $ref: '#/definitions/api.BuilderKeyExitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid key index
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Key cannot be exited yet
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exit a builder key
      tags:
      - Builder Keys
  /api/buildoor/builder-keys/{index}/topup:
    post:
      consumes:
      - application/json
      description: |-
        Submits a top-up deposit for the given key when its balance is
        below the configured threshold.
      operationId: topupBuilderKey
      parameters:
      - description: Internal builder key index
        in: path
        name: index
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid key index or top-up failed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Top up a builder key
      tags:
      - Builder Keys
  /api/buildoor/builder-keys/target:
    post:
      consumes:
      - application/json
      description: |-
        Sets how many builder keys are kept registered and funded.
        Raising it deposits new keys; lowering it exits surplus keys
        when auto-exit is on — an exited key can never be reactivated.
      operationId: updateBuilderKeyTarget
      parameters:
      - description: Target key count
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateBuilderKeyTargetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuilderKeysResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set the target builder key count
      tags:
      - Builder Keys
  /api/buildoor/builder-preferences:
    get:
      description: Returns all builder preferences currently in the cache, submitted
        by proposers via the submitBuilderPreferences API.
      operationId: getBuilderPreferences
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.BuilderPreferencesResponse'
        "404":
          description: Builder API not enabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get cached builder preferences
      tags:
      - Buildoor
  /api/buildoor/head-votes/{slot}:
    get:
      description: |-
        Returns the slot's raw single-attestation arrivals grouped by
        validator-ranges client name into fixed-width time buckets
        from the slot start, plus per-name totals and the count of
        attesters that landed on chain without being seen as singles.
        Only slots still retained by the head vote tracker are served.
      operationId: getHeadVoteDetail
      parameters:
      - description: Slot
        in: path
        name: slot
        required: true
        type: integer
      - description: 'Beacon block root (default: the slot''s primary root)'
        in: query
        name: root
        type: string
      - description: Bucket width in ms (default slot_ms/24, clamped to [50, slot_ms])
        in: query
        name: bucket_ms
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HeadVoteDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No vote detail retained for this slot
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Head vote tracker unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Per-name head-vote arrival heatmap for a slot
      tags:
      - Stats
  /api/buildoor/local-build/probe:
    post:
      description: |-
        Probes the EL RPC for the testing namespace now (instead of
        waiting for the periodic check) and returns the resulting
        availability. Requires authentication; audited.
      operationId: probeLocalBuild
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload_builder.LocalBuildAvailability'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Re-probe the EL for testing_buildBlockV1
      tags:
      - LocalBuild
  /api/buildoor/local-build/status:
    get:
      description: |-
        Returns whether the EL exposes testing_buildBlockV1 (probed),
        the per-EL blob handling, the effective local build settings
        and the transaction pool's availability and toggle state.
      operationId: getLocalBuildStatus
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LocalBuildStatusResponse'
      summary: Get the local build (testing_buildBlockV1) status
      tags:
      - LocalBuild
  /api/buildoor/overview:
    get:
      description: |-
        Returns a single-payload summary used by the multi-instance overview UI:
        running state, builder pubkey, current slot, EL client info, available/enabled
        services, balances, and recent build stats.
      operationId: getOverview
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.OverviewResponse'
      summary: Get a compact overview of this buildoor instance
      tags:
      - Buildoor
  /api/buildoor/proposer-preferences:
    get:
      description: Returns all proposer preferences currently in the cache, received
        via P2P gossip.
      operationId: getProposerPreferences
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.ProposerPreferencesResponse'
        "404":
          description: Proposer preferences not enabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get cached proposer preferences
      tags:
      - Buildoor
  /api/buildoor/rpc-access:
    get:
      description: 'API keys (without secrets), per-caller call stats (anonymous per
        IP or shared, per key, static token, WebUI login) and the read upstreams.
        Requires authentication: the stats carry client IPs.'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.RPCAccessResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No ingress
          schema:
            additionalProperties:
              type: string
            type: object
      summary: /rpc ingress access state
      tags:
      - Buildoor
  /api/buildoor/rpc-access/keys:
    post:
      consumes:
      - application/json
      description: 'Creates an API key for the /rpc ingress. The secret is returned
        once and never stored (only its SHA-256). Send it as "X-API-Key: <key>", "Authorization:
        Bearer <key>" or in the URL as /rpc/<key>.'
      parameters:
      - description: Key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateRPCKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.CreateRPCKeyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a /rpc API key
      tags:
      - Buildoor
  /api/buildoor/rpc-access/keys/{id}:
    delete:
      description: Deletes the key; callers using it are refused from the next request
        on.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a /rpc API key
      tags:
      - Buildoor
    post:
      consumes:
      - application/json
      description: Changes a key's label, enabled flag or rate limit. A disabled key
        is refused (401) without being deleted.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        type: string
      - description: Update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateRPCKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.RPCKeyView'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a /rpc API key
      tags:
      - Buildoor
  /api/buildoor/slot-results:
    get:
      description: |-
        Returns the recorded outcome history (build, bids, block
        submissions, reveals, inclusion, applied plan) for every
        active slot within the inclusive slot range.
      operationId: getSlotResults
      parameters:
      - description: Range start slot (inclusive)
        in: query
        name: min_slot
        required: true
        type: integer
      - description: Range end slot (inclusive)
        in: query
        name: max_slot
        required: true
        type: integer
      - description: summary = a compact record per slot (build status and headline
          fields, attempts, inclusion, tx plan) for overview grids
        in: query
        name: view
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SlotResultsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Results tracker unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get per-slot results
      tags:
      - ActionPlan
  /api/buildoor/slot-results/{slot}/bids:
    get:
      description: |-
        Lists the metadata of every signed bid stored for the slot
        (JSON only; fetch individual bids by index for SSZ). Returns
        an empty list for slots without bid artifacts.
      operationId: getSlotBidArtifacts
      parameters:
      - description: Slot
        in: path
        name: slot
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SlotBidArtifactsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Results tracker unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List a slot's signed bid artifacts
      tags:
      - ActionPlan
  /api/buildoor/slot-results/{slot}/bids/{index}:
    get:
      description: |-
        Returns one signed bid created for the slot, addressed by its
        artifact index (see the bid listing endpoint). Pre-Gloas bids
        are SignedBuilderBid, Gloas+ bids SignedExecutionPayloadBid.
        Content negotiation as with the payload artifact endpoint.
      operationId: getSlotBidArtifact
      parameters:
      - description: Slot
        in: path
        name: slot
        required: true
        type: integer
      - description: Bid artifact index
        in: path
        name: index
        required: true
        type: integer
      produces:
      - application/json
      - application/octet-stream
      responses:
        "200":
          description: Versioned signed bid (or raw SSZ)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No artifact for this slot/index
          schema:
            additionalProperties:
              type: string
            type: object
        "406":
          description: No acceptable content type
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get one signed bid of a slot
      tags:
      - ActionPlan
  /api/buildoor/slot-results/{slot}/envelope:
    get:
      description: |-
        Returns the signed execution payload envelope constructed for
        the slot's reveal (stored at construction time, so failed
        publishes remain inspectable). Content negotiation as with the
        payload artifact endpoint.
      operationId: getSlotEnvelopeArtifact
      parameters:
      - description: Slot
        in: path
        name: slot
        required: true
        type: integer
      produces:
      - application/json
      - application/octet-stream
      responses:
        "200":
          description: Versioned envelope (or raw SSZ)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No artifact for this slot
          schema:
            additionalProperties:
              type: string
            type: object
        "406":
          description: No acceptable content type
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the signed payload envelope of a slot
      tags:
      - ActionPlan
  /api/buildoor/slot-results/{slot}/payload:
    get:
      description: |-
        Returns the payload the slot's primary build target selected
        last (the one that fed the bids), or with ?candidate= the
        selection of that target. Every other payload the slot built
        is served by block hash (payloads/{blockHash}). With
        "Accept: application/octet-stream" the raw SSZ bytes are
        served; otherwise a {"version", "data"} JSON envelope. The
        Eth-Consensus-Version response header carries the fork name.
      operationId: getSlotPayloadArtifact
      parameters:
      - description: Slot
        in: path
        name: slot
        required: true
        type: integer
      - description: Build-parent candidate key (parent_full, parent_empty, grandparent_full,
          grandparent_empty)
        in: query
        name: candidate
        type: string
      produces:
      - application/json
      - application/octet-stream
      responses:
        "200":
          description: Versioned payload (or raw SSZ)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No artifact for this slot
          schema:
            additionalProperties:
              type: string
            type: object
        "406":
          description: No acceptable content type
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the selected execution payload of a slot
      tags:
      - ActionPlan
  /api/buildoor/slot-results/{slot}/payloads/{blockHash}:
    get:
      description: |-
        Returns one execution payload built for the slot, addressed by
        its block hash (the slot result's payloads, builds and
        selections name payloads by it). The engine payload and every
        selected payload are captured; a testing run's payload nobody
        selected is not. Content negotiation as with the selected
        payload endpoint.
      operationId: getSlotPayloadArtifactByHash
      parameters:
      - description: Slot
        in: path
        name: slot
        required: true
        type: integer
      - description: Payload block hash (0x-hex)
        in: path
        name: blockHash
        required: true
        type: string
      produces:
      - application/json
      - application/octet-stream
      responses:
        "200":
          description: Versioned payload (or raw SSZ)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No artifact for this block hash
          schema:
            additionalProperties:
              type: string
            type: object
        "406":
          description: No acceptable content type
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get one of a slot's built payloads by block hash
      tags:
      - ActionPlan
  /api/buildoor/txpool:
    delete:
      description: Clears the transaction pool. Requires authentication; audited.
      operationId: clearTxPool
      produces:
      - application/json
      responses:
        "200":
          description: dropped count
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Pool not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Drop every queued transaction
      tags:
      - LocalBuild
    get:
      description: |-
        Returns the pool's aggregate stats (pending count, senders, gas
        sum, value, blobs, lifetime counters) and a page of queued
        transactions.
      operationId: getTxPool
      parameters:
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Limit (default 50, max 500)
        in: query
        name: limit
        type: integer
      - description: Filter by sender address
        in: query
        name: sender
        type: string
      - description: arrival (default) | sender | tip
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TxPoolResponse'
        "401":
          description: Unauthorized (the pool holds private transactions)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Pool not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the transaction pool content
      tags:
      - LocalBuild
  /api/buildoor/txpool/{hash}:
    delete:
      description: |-
        Removes the transaction with the given hash from the pool.
        Requires authentication; audited.
      operationId: dropTxPoolTx
      parameters:
      - description: Transaction hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: removed
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Drop one queued transaction
      tags:
      - LocalBuild
  /api/buildoor/txpool/el-mempool:
    get:
      description: |-
        Returns the state of the mirror of the EL mempool's pending
        transactions (the testing build's fill source) and a page of
        its content. Public: these are the EL's public transactions.
        Reading it never starts the mirror, which runs only while
        builds use it.
      operationId: getELMempool
      parameters:
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Limit (max 500)
        in: query
        name: limit
        type: integer
      - description: Sender address filter
        in: query
        name: sender
        type: string
      - description: arrival | sender | tip
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ELMempoolResponse'
        "404":
          description: Pool not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the EL mempool mirror
      tags:
      - LocalBuild
  /api/buildoor/txpool/fees:
    get:
      description: |-
        Buckets the pending transactions of the EL mempool mirror by
        max fee per gas (log scale) against the next base fee and the
        block gas limit. buildoor's own (private) transactions are
        included, as their own series, only for logged-in readers.
      operationId: getTxPoolFees
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/txpool.FeeDistribution'
        "404":
          description: Pool not configured or no head
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: EL unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pending gas by max fee
      tags:
      - LocalBuild
  /api/buildoor/txpool/preview:
    get:
      description: |-
        Runs the pool selection against the current head with the
        live settings and returns what a local block built now would
        contain (count, gas sum, skipped-by-reason), without building.
      operationId: getTxPoolPreview
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TxPoolPreviewResponse'
        "401":
          description: Unauthorized (the pool holds private transactions)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Pool not configured or no head
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Selection failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview the next local block's selection
      tags:
      - LocalBuild
  /api/buildoor/validators:
    get:
      description: Returns the list of validators registered via the Builder API (fee
        recipient preferences). Not paginated.
      operationId: getValidators
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.GetValidatorsResponse'
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List registered validators
      tags:
      - Buildoor
  /api/config:
    get:
      description: Returns the buildoor configuration in use. Sensitive fields (builder
        key, wallet key, JWT secret) are redacted.
      operationId: getConfig
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get buildoor configuration
      tags:
      - Config
  /api/config/epbs:
    post:
      consumes:
      - application/json
      description: |-
        Updates the EPBS (enshrined PBS) configuration including timing and bid
        parameters. Requires authentication.
      operationId: updateEPBS
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: EPBS configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateEPBSRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update EPBS configuration
      tags:
      - Config
  /api/config/schedule:
    post:
      consumes:
      - application/json
      description: |-
        Updates the builder schedule configuration including mode, every_nth, and next_n
        settings. Requires authentication.
      operationId: updateSchedule
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Schedule configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update schedule configuration
      tags:
      - Config
  /api/config/settings:
    post:
      consumes:
      - application/json
      description: |-
        Applies partial global settings updates keyed by canonical
        settings paths (e.g. {"epbs.bid_subsidy": 1000,
        "schedule.mode": "all"}) without requiring full config
        objects. Unknown keys are rejected. Requires authentication.
      operationId: updateSettings
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Map of settings key paths to values
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Unknown key or invalid value
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update global settings by key path
      tags:
      - Config
  /api/lifecycle/deposit:
    post:
      consumes:
      - application/json
      description: |-
        Initiates a builder registration deposit. If the builder is not yet
        registered, this will register it with the specified amount. Requires authentication.
      operationId: postDeposit
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Deposit amount in gwei
        in: body
        name: request
        required: true
        schema:
          properties:
            amount_gwei:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Lifecycle management not enabled
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger builder deposit
      tags:
      - Lifecycle
  /api/lifecycle/exit:
    post:
      consumes:
      - application/json
      description: |-
        Initiates a voluntary exit for the builder. This will begin the withdrawal
        process and the builder will stop being eligible for block building after
        the exit is processed. Requires authentication.
      operationId: postExit
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Lifecycle management not enabled
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger voluntary exit
      tags:
      - Lifecycle
  /api/lifecycle/status:
    get:
      description: |-
        Returns the builder lifecycle status including registration state, balance,
        pending payments, and epoch information.
      operationId: getLifecycleStatus
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/api.LifecycleStatusResponse'
        "404":
          description: Lifecycle management not enabled
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get lifecycle status
      tags:
      - Lifecycle
  /api/lifecycle/topup:
    post:
      consumes:
      - application/json
      description: |-
        Checks the builder balance and initiates a top-up if needed based on
        configured thresholds. Requires authentication.
      operationId: postTopup
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
